<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaveamento Oficial | CONMEBOL Sul-Americana</title>
    <!-- CACHE BUSTER ?v=2 -->
    <link rel="stylesheet" href="assets/css/chaveamento-sulamericana.css?v=2">
</head>
<body>

    <!-- CABEÇALHO -->
    <header id="cabecalho">
        <a href="sul-americana.html" class="link-voltar">&larr; Voltar ao Sorteio</a>
        <h1 class="titulo-pagina">CHAVEAMENTO</h1>
        <div class="espacador"></div>
    </header>

    <!-- DICA DE NAVEGAÇÃO NO CELULAR -->
    <div class="dica-mobile">
        <span>⟵ Deslize para navegar na árvore ⟶</span>
    </div>

    <!-- ÁRVORE VISUAL DO MATA-MATA (BRACKET DESLIZÁVEL) -->
    <main id="conteudo-principal">
        <div class="bracket-container">

            <!-- ================= LADO ESQUERDO (A, C, E, G) ================= -->
            <div class="lado-bracket lado-esquerdo">
                
                <!-- OITAVAS DE FINAL -->
                <div class="coluna-fase fase-oitavas">
                    <div class="card-chave" id="chave-oitavas-A">
                        <span class="tag-fase">A</span>
                        <div class="slot-time" id="oitavas-A-t1">N/D</div>
                        <div class="slot-time" id="oitavas-A-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-C">
                        <span class="tag-fase">C</span>
                        <div class="slot-time" id="oitavas-C-t1">N/D</div>
                        <div class="slot-time" id="oitavas-C-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-E">
                        <span class="tag-fase">E</span>
                        <div class="slot-time" id="oitavas-E-t1">N/D</div>
                        <div class="slot-time" id="oitavas-E-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-G">
                        <span class="tag-fase">G</span>
                        <div class="slot-time" id="oitavas-G-t1">N/D</div>
                        <div class="slot-time" id="oitavas-G-t2">N/D</div>
                    </div>
                </div>

                <!-- QUARTAS DE FINAL -->
                <div class="coluna-fase fase-quartas">
                    <div class="card-chave" id="chave-quartas-1">
                        <span class="tag-fase">Q1</span>
                        <div class="slot-time" id="quartas-1-t1">N/D</div>
                        <div class="slot-time" id="quartas-1-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-quartas-2">
                        <span class="tag-fase">Q2</span>
                        <div class="slot-time" id="quartas-2-t1">N/D</div>
                        <div class="slot-time" id="quartas-2-t2">N/D</div>
                    </div>
                </div>

                <!-- SEMIFINAL 1 -->
                <div class="coluna-fase fase-semi">
                    <div class="card-chave" id="chave-semi-1">
                        <span class="tag-fase">S1</span>
                        <div class="slot-time" id="semi-1-t1">N/D</div>
                        <div class="slot-time" id="semi-1-t2">N/D</div>
                    </div>
                </div>

            </div>

            <!-- ================= CENTRO: A GRANDE FINAL ================= -->
            <div class="centro-final">
                <div class="arena-final">
                    <div class="slot-finalista" id="finalista-lado-a">N/D</div>

                    <div class="emblema-final">
                        <img src="https://www.ogol.com.br/img/logos/competicoes/269_imgbank_cs_20250311124354.png" alt="Taça Sul-Americana">
                        <span class="texto-sede-final">FINAL MONTEVIDEO 2026</span>
                    </div>

                    <div class="slot-finalista" id="finalista-lado-b">N/D</div>
                </div>

                <div class="slogan-gloria">
                    LA GRAN CONQUISTA
                </div>
            </div>

            <!-- ================= LADO DIREITO (B, D, F, H) ================= -->
            <div class="lado-bracket lado-direito">
                
                <!-- SEMIFINAL 2 -->
                <div class="coluna-fase fase-semi">
                    <div class="card-chave" id="chave-semi-2">
                        <span class="tag-fase">S2</span>
                        <div class="slot-time" id="semi-2-t1">N/D</div>
                        <div class="slot-time" id="semi-2-t2">N/D</div>
                    </div>
                </div>

                <!-- QUARTAS DE FINAL -->
                <div class="coluna-fase fase-quartas">
                    <div class="card-chave" id="chave-quartas-3">
                        <span class="tag-fase">Q3</span>
                        <div class="slot-time" id="quartas-3-t1">N/D</div>
                        <div class="slot-time" id="quartas-3-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-quartas-4">
                        <span class="tag-fase">Q4</span>
                        <div class="slot-time" id="quartas-4-t1">N/D</div>
                        <div class="slot-time" id="quartas-4-t2">N/D</div>
                    </div>
                </div>

                <!-- OITAVAS DE FINAL -->
                <div class="coluna-fase fase-oitavas">
                    <div class="card-chave" id="chave-oitavas-B">
                        <span class="tag-fase">B</span>
                        <div class="slot-time" id="oitavas-B-t1">N/D</div>
                        <div class="slot-time" id="oitavas-B-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-D">
                        <span class="tag-fase">D</span>
                        <div class="slot-time" id="oitavas-D-t1">N/D</div>
                        <div class="slot-time" id="oitavas-D-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-F">
                        <span class="tag-fase">F</span>
                        <div class="slot-time" id="oitavas-F-t1">N/D</div>
                        <div class="slot-time" id="oitavas-F-t2">N/D</div>
                    </div>

                    <div class="card-chave" id="chave-oitavas-H">
                        <span class="tag-fase">H</span>
                        <div class="slot-time" id="oitavas-H-t1">N/D</div>
                        <div class="slot-time" id="oitavas-H-t2">N/D</div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script src="assets/js/chaveamento-sulamericana.js"></script>
</body>
</html>
