<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONMEBOL PES | Seleção de Torneio</title>
    <!-- CACHE BUSTER ?v=10 -->
    <link rel="stylesheet" href="assets/css/index.css?v=10">
</head>
<body>

    <!-- CABEÇALHO OFICIAL -->
    <header id="cabecalho">
        <h1>SELEÇÃO DE COMPETIÇÃO</h1>
        <p id="descricao-torneio">Escolha o torneio para realizar a cerimônia e sorteio oficial</p>
    </header>

    <!-- PALCO DE SELEÇÃO DOS TORNEIOS -->
    <main id="conteudo-principal">
        <section class="container-selecao-copa">
            
            <!-- CARD LIBERTADORES (AGORA ENTRA NA APRESENTAÇÃO) -->
            <a href="apresentacao-libertadores.html" class="card-copa libertadores">
                <div class="emblema-copa">
                    <img src="https://www.ogol.com.br/img/logos/edicoes/130437_imgbank_.png" alt="Logo Libertadores">
                </div>
                <div class="bloco-info-card">
                    <h2>CONMEBOL</h2>
                    <h2>Libertadores</h2>
                    <span class="slogan-card">A GLÓRIA ETERNA</span>
                </div>
                <span class="btn-acessar">Iniciar Cerimônia &rarr;</span>
            </a>

            <!-- CARD SUL-AMERICANA -->
            <a href="apresentacao-sulamericana.html" class="card-copa sulamericana">
                <div class="emblema-copa">
                    <img src="https://www.ogol.com.br/img/logos/competicoes/269_imgbank_cs_20250311124354.png" alt="Logo Sul-Americana">
                </div>
                <div class="bloco-info-card">
                    <h2>CONMEBOL</h2>
                    <h2>Sul-Americana</h2>
                    <span class="slogan-card">A GRANDE CONQUISTA</span>
                </div>
                <span class="btn-acessar">Sortear Oitavas &rarr;</span>
            </a>

        </section>
    </main>

    <footer id="rodape">
        <p>CONMEBOL &copy; Gerenciador de Mata-Mata PES Oficial</p>
    </footer>

</body>
</html>
